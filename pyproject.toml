[project]
name = "dumpstermap-backend"
version = "0.1.0"
description = "Backend of Dumpstermap.org, a collaborative world wide map to share dumpster locations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django",
    "django-cors-headers",
    "djangorestframework",
    "djangorestframework-gis",
    "requests",
    "gunicorn",
    "django-environ",
    "python-dotenv",
    "sentry-sdk",
    "fastkml",
    "pytz",
    "mercantile",
    "whitenoise",
    "bucketstore",
    "geojson",
    "pytest-env>=1.8.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pre-commit",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
